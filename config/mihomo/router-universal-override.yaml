# Mihomo 通用 YAML 覆写：Windows / macOS / Android
# 用途：通过 Sub-Store「文件 → Mihomo 配置」以原有订阅/组合订阅为节点来源，加载此远程覆写。
# 仅维护通用分流规则、规则提供者和策略组；DNS、TUN、系统代理等设备参数由各客户端单独管理。
# 节点/策略组选择不会在不同客户端之间自动同步。
# AI 组仅筛选美区节点；流媒体组仅筛选名称含「流媒体」或「LMT」的节点。
# 原始行为保持不变：以 REJECT 为首选项的组需要手动选择节点，否则相应流量会被阻断。
# 远程规则提供者保留 86400 秒更新间隔，规则缓存目录统一为 router-universal。

rules:
- RULE-SET,Private / Domain,DIRECT
- RULE-SET,Private / IP,DIRECT,no-resolve
- AND,((RULE-SET,NonCN / Domain),(NETWORK,UDP),(DST-PORT,443)),REJECT
- DOMAIN-SUFFIX,docker.com,Docker
- DOMAIN-SUFFIX,docker.io,Docker
- DOMAIN-SUFFIX,dockerhub.com,Docker
- DOMAIN-SUFFIX,dockerstatic.com,Docker
- DOMAIN,cdn.auth0.com,Docker
- DOMAIN,production.cloudflare.docker.com,Docker
- RULE-SET,Direct / Domain,DIRECT
- RULE-SET,Block / Domain,REJECT
- RULE-SET,ChatGPT / Domain,AI
- RULE-SET,Claude / Domain,AI
- RULE-SET,Meta AI / Domain,AI
- RULE-SET,Perplexity / Domain,AI
- RULE-SET,GitHub / Domain,国外
- RULE-SET,Docker / Domain,Docker
- RULE-SET,Telegram / Domain,国外
- RULE-SET,Telegram / IP,国外,no-resolve
- RULE-SET,Twitter / Domain,国外
- RULE-SET,WhatsApp / Domain,国外
- RULE-SET,Facebook / Domain,国外
- RULE-SET,Amazon / Domain,国外
- RULE-SET,Apple-CN / Domain,DIRECT
- RULE-SET,Apple / Domain,国外
- RULE-SET,Microsoft / Domain,国外
- RULE-SET,OKX / Domain,国外
- RULE-SET,Bybit / Domain,国外
- RULE-SET,Binance / Domain,国外
- RULE-SET,Youtube / Domain,YouTube
- RULE-SET,TikTok / Domain,流媒体
- RULE-SET,Netflix / Domain,流媒体
- RULE-SET,Netflix / IP,流媒体,no-resolve
- RULE-SET,Disney / Domain,流媒体
- RULE-SET,HBO / Domain,流媒体
- RULE-SET,Spotify / Domain,流媒体
- RULE-SET,Twitch / Domain,Twitch
- RULE-SET,Steam / Domain,国外
- RULE-SET,Epic / Domain,国外
- RULE-SET,EA / Domain,国外
- RULE-SET,Blizzard / Domain,国外
- RULE-SET,UBI / Domain,国外
- RULE-SET,PlayStation / Domain,国外
- RULE-SET,Nintend / Domain,国外
- RULE-SET,Google / Domain,国外
- RULE-SET,Google / IP,国外,no-resolve
- RULE-SET,Proxy / Domain,国外
- RULE-SET,Globe / Domain,国外
- RULE-SET,China / Domain,DIRECT
- RULE-SET,China / IP,DIRECT,no-resolve
- MATCH,其他

# 公共规则提供者参数，通过 YAML 锚点供下方各规则集复用。
x-rule-defaults:
  classical: &rule-classical {type: http, interval: 86400, behavior: classical, format: text}
  domain: &rule-domain {type: http, interval: 86400, behavior: domain, format: mrs}
  ip: &rule-ip {type: http, interval: 86400, behavior: ipcidr, format: mrs}
rule-providers:
  Direct / Domain:
    <<: *rule-classical
    url: https://gh-proxy.com/raw.githubusercontent.com/flying864/rule/refs/heads/main/config/openclash/Direct
    path: ./ruleset/router-universal/rule-01.list
  ChatGPT / Domain:
    <<: *rule-domain
    url: https://gh-proxy.com/github.com/metacubex/meta-rules-dat/raw/refs/heads/meta/geo/geosite/openai.mrs
    path: ./ruleset/router-universal/rule-02.mrs
  Claude / Domain:
    <<: *rule-classical
    url: https://gh-proxy.com/raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Claude/Claude.list
    path: ./ruleset/router-universal/rule-03.list
  Meta AI / Domain:
    <<: *rule-classical
    url: https://gh-proxy.com/raw.githubusercontent.com/liandu2024/clash/refs/heads/main/list/MetaAi.list
    path: ./ruleset/router-universal/rule-04.list
  Perplexity / Domain:
    <<: *rule-domain
    url: https://gh-proxy.com/github.com/metacubex/meta-rules-dat/raw/refs/heads/meta/geo/geosite/perplexity.mrs
    path: ./ruleset/router-universal/rule-05.mrs
  GitHub / Domain:
    <<: *rule-domain
    url: https://gh-proxy.com/github.com/metacubex/meta-rules-dat/raw/refs/heads/meta/geo/geosite/github.mrs
    path: ./ruleset/router-universal/rule-06.mrs
  Docker / Domain:
    <<: *rule-classical
    url: https://gh-proxy.com/raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Docker/Docker.list
    path: ./ruleset/router-universal/rule-07.list
  Telegram / Domain:
