proxy-groups:
- name: 节点选择
  icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/Static.png
  type: select
  proxies:
  - DIRECT
  include-all: true
- name: 自动选择
  icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/Urltest.png
  type: url-test
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  lazy: true
  include-all: true
- name: 流媒体
  icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/Streaming.png
  type: select
  filter: 流媒体|LMT
  proxies:
  - REJECT
  exclude-type: direct|compatible
  empty-fallback: REJECT
  include-all: true
- name: Twitch
  icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/Twitch.png
  type: select
  filter: (?i)(流媒体|LMT)
  proxies:
  - REJECT
  exclude-type: direct|compatible
  empty-fallback: REJECT
  include-all: true
- name: YouTube
  icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/YouTube.png
  type: select
  proxies:
  - 自动选择
  - 节点选择
  - DIRECT
  include-all: true
- name: AI
  icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/OpenAI.png
  type: select
  filter: (?i)(美|美国|US|USA|United States|America|洛杉矶|西雅图|纽约|硅谷)
  proxies:
  - REJECT
  exclude-type: direct|compatible
  empty-fallback: REJECT
  include-all: true
- name: Docker
  icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/box.png
  type: select
  include-all: true
- name: 国外
  icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/Global.png
  type: select
  proxies:
  - 自动选择
  - 节点选择
  - DIRECT
  - REJECT
- name: 其他
  icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/Final.png
  type: select
  proxies:
  - 自动选择
  - 节点选择
  - DIRECT
  - REJECT
