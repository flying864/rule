proxy-groups:
  - name: 节点选择
    icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/Static.png
    type: select
    proxies:
      - 自动选择
      - DIRECT
    include-all: true

  - name: 自动选择
    icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/Urltest.png
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true
    # 排除家宽/住宅节点，避免日常网页与大流量下载误抢家宽带宽或触发风控
    exclude-filter: '(?i)(家宽|家寬|住宅)'
    include-all: true

  - name: AI
    icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/OpenAI.png
    type: select
    # 仅筛选家宽/住宅/AI 标签并排除专线，默认自动选中 US-美国家宽AI-流媒体
    filter: '(?i)(家宽|家寬|住宅|(^|[^A-Za-z])ai([^A-Za-z]|$))'
    exclude-filter: '(?i)(专线|專線|IEPL|IPLC)'
    exclude-type: direct|compatible
    empty-fallback: REJECT
    include-all: true

  - name: 流媒体
    icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/Streaming.png
    type: select
    filter: '(?i)(流媒体|流媒體|LMT|Netflix|奈飞|奈飛|家宽|家寬|住宅)'
    exclude-filter: '(?i)(专线|專線|IEPL|IPLC)'
    exclude-type: direct|compatible
    empty-fallback: REJECT
    include-all: true

  - name: Twitch
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Twitch.png
    type: select
    proxies:
      - 自动选择
      - 流媒体
      - 节点选择
    empty-fallback: REJECT
    include-all: true

  - name: YouTube
    icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/YouTube.png
    type: select
    proxies:
      - 自动选择
      - 节点选择
      - DIRECT
    include-all: true

  - name: Docker
    icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/box.png
    type: select
    proxies:
      - 自动选择
      - 节点选择
    include-all: true

  - name: 国外
    icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/Global.png
    type: select
    proxies:
      - 自动选择
      - 节点选择
      - DIRECT
      - REJECT

  - name: 其他
    icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/Final.png
    type: select
    proxies:
      - 自动选择
      - 节点选择
      - DIRECT
      - REJECT
