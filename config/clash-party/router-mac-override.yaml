# ===== 策略组：上层业务分流面板 + 下层三类隔离线路池 =====
proxy-groups:
  # --- 1. 业务分流层 ---
  - name: 网页浏览
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Proxy.png
    type: select
    proxies:
      - 专线节点
      - 普通线路
      - DIRECT
      - REJECT

  - name: AI
    icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/OpenAI.png
    type: select
    # 匹配 AI / 家宽 / 住宅（兼容“AI家宽专线”命名）；无匹配节点时严格 REJECT 阻断
    filter: '(?i)(家宽|家寬|住宅|OpenAI|ChatGPT|Claude|(^|[^A-Za-z])ai([^A-Za-z]|$))'
    exclude-type: direct|compatible
    empty-fallback: REJECT
    include-all: true

  - name: 流媒体
    icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/Streaming.png
    type: select
    # Netflix / Disney+ / TikTok / Spotify 等默认走 AI 家宽解锁线路；无匹配节点时严格 REJECT
    filter: '(?i)(家宽|家寬|住宅|流媒体|流媒體|解锁|解鎖|LMT|Media|Netflix|NF|Disney|奈飞|奈飛|(^|[^A-Za-z])ai([^A-Za-z]|$))'
    exclude-type: direct|compatible
    empty-fallback: REJECT
    include-all: true

  - name: YouTube
    icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/YouTube.png
    type: select
    proxies:
      - 普通线路
      - 专线节点
      - 流媒体
      - DIRECT

  - name: Twitch
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Twitch.png
    type: select
    proxies:
      - 普通线路
      - 流媒体
      - 专线节点
      - REJECT

  - name: Docker
    icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/box.png
    type: select
    proxies:
      - 普通线路
      - 专线节点
      - DIRECT

  - name: 大流量下载
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Download.png
    type: select
    proxies:
      - 普通线路
      - DIRECT
      - 专线节点
      - REJECT

  - name: Telegram
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Telegram.png
    type: select
    proxies:
      - 普通线路
      - 专线节点
      - REJECT

  - name: 其他
    icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/Final.png
    type: select
    proxies:
      - 普通线路
      - 网页浏览
      - DIRECT
      - REJECT

  # --- 2. 底层线路池（专线 / 普通手动 / 普通自动测速） ---
  - name: 专线节点
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Speedtest.png
    type: select
    # 仅筛选纯专线节点，排除带 AI/家宽/流媒体标签的节点
    filter: '(?i)(专线|專線|IEPL|IPLC)'
    exclude-filter: *leased_exclude
    exclude-type: direct|compatible
    include-all: true

  - name: 普通线路
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Available.png
    type: select
    proxies:
      - 普通自动
    default-selected: 普通自动
    exclude-filter: *ordinary_exclude
    exclude-type: direct|reject|compatible
    include-all: true

  - name: 普通自动
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Auto.png
    type: url-test
    url: https://www.gstatic.com/generate_204
    expected-status: 204
    interval: 300
    timeout: 5000
    tolerance: 50
    max-failed-times: 3
    lazy: true
    exclude-filter: *ordinary_exclude
    exclude-type: direct|reject|compatible
    include-all: true
