proxy-groups:
  - name: 节点选择
    icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/Static.png
    type: select
    proxies:
      - 自动选择
      - DIRECT
    exclude-type: direct|compatible
    include-all: true

  - name: 自动选择
    icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/Urltest.png
    type: url-test
    url: https://www.gstatic.com/generate_204
    expected-status: 204
    interval: 300
    timeout: 5000
    tolerance: 50
    max-failed-times: 3
    lazy: true
    # 排除家宽/住宅节点（保护纯净度与带宽）及伪节点类型
    exclude-filter: '(?i)(家宽|家寬|住宅)'
    exclude-type: direct|reject|compatible
    include-all: true

  - name: AI
    icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/OpenAI.png
    type: select
    # 仅筛选家宽/住宅/AI 标签并排除专线；无匹配节点时严格 REJECT 阻断防泄露
    filter: '(?i)(家宽|家寬|住宅|OpenAI|ChatGPT|Claude|(^|[^A-Za-z])ai([^A-Za-z]|$))'
    exclude-filter: '(?i)(专线|專線|IEPL|IPLC)'
    exclude-type: direct|compatible
    empty-fallback: REJECT
    include-all: true

  - name: 流媒体
    icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/Streaming.png
    type: select
    filter: '(?i)(流媒体|流媒體|解锁|解鎖|LMT|Media|Netflix|NF|Disney|奈飞|奈飛|家宽|家寬|住宅)'
    exclude-filter: '(?i)(专线|專線|IEPL|IPLC)'
    exclude-type: direct|compatible
    empty-fallback: REJECT
    include-all: true

  - name: Twitch
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Twitch.png
    type: select
    proxies:
      - 自动选择
      - 流媒体
      - 节点选择
    exclude-type: direct|compatible
    empty-fallback: REJECT
    include-all: true

  - name: YouTube
    icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/YouTube.png
    type: select
    proxies:
      - 自动选择
      - 节点选择
      - DIRECT
    exclude-type: direct|compatible
    include-all: true

  - name: Docker
    icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/box.png
    type: select
    proxies:
      - 自动选择
      - 节点选择
    exclude-type: direct|compatible
    include-all: true

  - name: 国外
    icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/Global.png
    type: select
    proxies:
      - 自动选择
      - 节点选择
      - DIRECT
      - REJECT

  - name: 其他
    icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/Final.png
    type: select
    proxies:
      - 自动选择
      - 节点选择
      - DIRECT
      - REJECT
