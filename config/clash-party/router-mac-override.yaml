# ==============================================================================
# Mihomo 三层线路分流覆写模板（专线网页 + AI家宽解锁 + 普通线路扛大流量）
# 单一维护源：修改本文件推送到 main 分支后，GitHub Actions 约 9 秒自动转换并同步至
# https://sub.fanco124.eu.org/my 的 fanco-router-universal 模板。
#
# 社区“三层节点池 + 业务分流层”设计架构：
# 1. [专线层 -> 网页浏览] 日常海外网页（Google/GitHub网页/X/Reddit/交易所等）走低延迟专线；
#    无专线节点的订阅（如 oci-4nodes）自动剥离空专线组并无缝降级到普通线路。
# 2. [家宽层 -> AI / 流媒体] AI 与 Netflix/Disney+/TikTok/Spotify 走原生住宅/AI家宽线路；
#    支持节点命名为“AI家宽专线”而不与普通专线混淆；无家宽/AI节点时严格 REJECT 阻断防风控。
# 3. [普通大流量层 -> 视频/直播/容器/下载/TG/兜底] 在 NonCN 网页规则之前提前拦截：
#    YouTube、Twitch、Docker、GitHub Release/Clone、云盘同步、系统/游戏更新、Speedtest、
#    通用大文件 CDN（Sukka download）、Telegram、海外非443 UDP 及 MATCH 兜底，全部走普通线路，
#    严防大流量业务偷跑昂贵专线或家宽流量。
# ==============================================================================

rules:
  # ===== 第 1 层：局域网与私有地址防回环 =====
  - RULE-SET,Private / Domain,DIRECT
  - RULE-SET,Private / IP,DIRECT,no-resolve

  # ===== 第 2 层：私有直连、黑名单与 QUIC 左短路阻断 =====
  - RULE-SET,Direct / Domain,DIRECT
  - RULE-SET,Block / Domain,REJECT
  # NETWORK 与 DST-PORT 置左 O(1) 短路；拦截海外域名与 Google/Netflix 裸 IP 的 HTTP/3 QUIC
  - AND,((NETWORK,UDP),(DST-PORT,443),(OR,((RULE-SET,NonCN / Domain),(RULE-SET,Netflix / IP,no-resolve),(RULE-SET,Google / IP,no-resolve)))),REJECT

  # ===== 第 3 层：AI 与锁区流媒体（走 AI家宽线路；含 UDP 下落跨区防泄露） =====
  - RULE-SET,AI-Custom / Domain,AI
  - RULE-SET,AI / Domain,AI
  - AND,((NETWORK,UDP),(OR,((RULE-SET,AI-Custom / Domain),(RULE-SET,AI / Domain)))),REJECT

  - RULE-SET,Netflix-Extra / Domain,流媒体
  - RULE-SET,Netflix / Domain,流媒体
  - RULE-SET,TikTok / Domain,流媒体
  - RULE-SET,Disney / Domain,流媒体
  - RULE-SET,HBO / Domain,流媒体
  - RULE-SET,PrimeVideo / Domain,流媒体
  - RULE-SET,Spotify / Domain,流媒体
  - AND,((NETWORK,UDP),(OR,((RULE-SET,Netflix-Extra / Domain),(RULE-SET,Netflix / Domain),(RULE-SET,TikTok / Domain),(RULE-SET,Disney / Domain),(RULE-SET,HBO / Domain),(RULE-SET,PrimeVideo / Domain),(RULE-SET,Spotify / Domain)))),REJECT

  # ===== 第 4 层：国内双栈大流量 CDN 先行直连（跑满本地宽带） =====
  - RULE-SET,Apple-CN / Domain,DIRECT
  - RULE-SET,Microsoft-CN / Domain,DIRECT
  - RULE-SET,Games-CN / Domain,DIRECT

  # ===== 第 5 层：高带宽视频、容器、Telegram 与大文件下载（提前拦截进普通线路，省专线流量） =====
  - RULE-SET,Youtube / Domain,YouTube
  - RULE-SET,Twitch / Domain,Twitch
  - RULE-SET,Docker-Extra / Domain,Docker
  - RULE-SET,Docker / Domain,Docker
  - RULE-SET,Telegram / Domain,Telegram

  # 各类大文件下载、仓库归档、网盘同步、系统/游戏更新与测速统一归入「大流量下载」（默认普通线路）
  - RULE-SET,GitHubDownload / Domain,大流量下载
  - RULE-SET,Drive-Extra / Domain,大流量下载
  - RULE-SET,OneDrive / Domain,大流量下载
  - RULE-SET,Dropbox / Domain,大流量下载
  - RULE-SET,iCloud / Domain,大流量下载
  - RULE-SET,AppleUpdate / Domain,大流量下载
  - RULE-SET,GooglePlay / Domain,大流量下载
  - RULE-SET,Games-NonCN / Domain,大流量下载
  - RULE-SET,Speedtest / Domain,大流量下载
  - RULE-SET,Download / Domain,大流量下载
  - RULE-SET,Download / Extra,大流量下载

  # ===== 第 6 层：日常海外网页浏览（走专线节点；海外剩余 UDP 分流至普通线路） =====
  - RULE-SET,Proxy / Domain,网页浏览
  - AND,((NETWORK,UDP),(RULE-SET,NonCN / Domain)),普通线路
  - RULE-SET,NonCN / Domain,网页浏览
  - RULE-SET,China / Domain,DIRECT

  # ===== 第 7 层：纯 IP 规则统一后置（全部携带 no-resolve，仅匹配裸 IP 连接） =====
  - RULE-SET,Netflix / IP,流媒体,no-resolve
  - AND,((NETWORK,UDP),(RULE-SET,Netflix / IP,no-resolve)),REJECT
  - RULE-SET,Telegram / IP,Telegram,no-resolve
  - AND,((NETWORK,UDP),(RULE-SET,Google / IP,no-resolve)),普通线路
  - RULE-SET,Google / IP,网页浏览,no-resolve
  - RULE-SET,China / IP,DIRECT,no-resolve

  # ===== 第 8 层：最终兜底（走普通线路） =====
  - MATCH,其他

# 公共锚点定义（Mihomo 忽略 x-* 辅助键；同步脚本自动展开并剥离）
x-rule-defaults:
  classical: &rule-classical {type: http, interval: 86400, behavior: classical, format: text}
  domain_txt: &rule-domain-txt {type: http, interval: 86400, behavior: domain, format: text}
  domain: &rule-domain {type: http, interval: 86400, behavior: domain, format: mrs}
  ip: &rule-ip {type: http, interval: 86400, behavior: ipcidr, format: mrs}

x-group-defaults:
  # 普通线路池排除词：剔除所有专线、家宽、AI、流媒体专属节点
  ordinary_exclude: &ordinary_exclude '(?i)(专线|專線|IEPL|IPLC|家宽|家寬|住宅|流媒体|流媒體|解锁|解鎖|LMT|Media|Netflix|NF|Disney|奈飞|奈飛|OpenAI|ChatGPT|Claude|(^|[^A-Za-z])ai([^A-Za-z]|$))'
  # 纯专线池排除词：剔除带 AI / 家宽 / 住宅 / 流媒体标签的节点（避免误吸“AI家宽专线”）
  leased_exclude: &leased_exclude '(?i)(家宽|家寬|住宅|流媒体|流媒體|解锁|解鎖|LMT|Media|Netflix|NF|Disney|奈飞|奈飛|OpenAI|ChatGPT|Claude|(^|[^A-Za-z])ai([^A-Za-z]|$))'

