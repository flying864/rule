# 规则提供器格式：behavior: domain / format: yaml；唯一顶层字段为 payload。
# GitHub 沿用已有兼容性范围，并非通用故障结论。
# NTP 为预防性兼容例外，而非已测故障；本列表不改变 UDP 分流。
# 真实 IP 不代表直连，实际出口仍由路由规则决定。
# 本地域名与私有 DNS 应在本地主配置独立维护，不能仅依赖远程规则。
# 不要泛化到 Google、Apple 或 CDN 全域；候选仅遇到相关问题并诊断后再启用。
payload:
  # GitHub：沿用已有范围。
  - '+.github.com'
  - '+.githubusercontent.com'
  - '+.githubassets.com'
  # NTP：适度预防性兼容例外。
  - 'time.windows.com'
  - 'time.apple.com'
  - 'time-ios.apple.com'
  - 'time.google.com'
  - 'time.cloudflare.com'
  - 'time.nist.gov'
  - 'time.android.com'
  - '+.pool.ntp.org'
  # mc服务器
  - '+.123883.xyz'
  - '+.fanho515.eu.org'

  # 候选：联网检测/门户检测，仅遇到相关问题再启用。
